<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>puzzle</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="title-area">
        <h1>puzzleGame</h1>
         <div id="explanation">
            <h3>説明</h3>
            <p>同じ色の玉を3つ以上揃えて消していくパズルゲームです。<br>コンボを繋げれば繋げるほどスコアがアップ!<br>制限時間内に目標スコアを達成して籠をりんごでいっぱいにしよう!</p>
        </div>
        <button id="start-button">start</button>
    </div>
    <div id="game-container" class="hidden">
        <div>
            <div id="ui-area">
                <div id="timer-area">
                    <h2>
                        <span>TIME:</span>
                        <span id="timer">100</span>
                    </h2>
                </div>
                <div id="score-area">
                    <h2>
                        <span>目標スコア:</span>
                        <span id="target-score"></span>
                    </h2>
                    <h2>
                        <span>SCORE:</span>
                        <i><span id="score"></span></i>
                    </h2>
                </div>
                <div id="combo-area">
                    <h2>
                        <span>COMBO:</span>
                        <i><span id="combo"></span></i>
                    </h2>
                </div>
            </div>
            <div id="model-area"></div>
        </div>
        <div id="game-board"></div>
    </div>

    <div id="result">
        <h1 id="time-over" class="hidden"><i>TimeOver</i></h1>
        <h1 id="game-clear" class="hidden"><i>GameClear</i></h1>
    </div>

    <div id="menu-area" class="hidden">
        <button id="title-button">title</button>
        <button id="retry-button">retry</button>
    </div>

    <script type="module" src="main.js"></script>
    <script src="puzzle.js"></script>
</body>

</html>
