<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>puzzle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="title-area">
        <h1>puzzleGame</h1>
        <button id="start">start</button>
    </div>
    <div id="game-container" class="hidden">
        <div id="game-board"></div>
        <div id="ui-area">
            <div id="score-area">
                <h2>
                    <span>SCORE:</span>
                    <i><span id="score">0</span></i>
                </h2>
            </div>
            <div id="combo-area">
                <h2>
                    <span>COMBO:</span>
                    <i><span id="combo">0</span></i>
                </h2>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
    <script src="puzzle.js"></script>
</body>

</html>
